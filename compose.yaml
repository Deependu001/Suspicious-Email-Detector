services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EMAIL_DETECTOR_DATABASE_PATH: /app/data/history.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - email_detector_history:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      EMAIL_DETECTOR_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  email_detector_history: